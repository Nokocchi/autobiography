<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag - My Autobiography</title>

    <link rel="stylesheet" href="css/style.css">

</head>
<body>

<header id="site-header"></header>

<main>

    <section class="page-header">
        <h1 id="tag-title">Tag</h1>
        <p id="tag-description">
            Browse posts with this tag.
        </p>
    </section>

    <section class="tag-filter" aria-label="Filter by category">
        <label for="category-filter">
            Category:
        </label>

        <select id="category-filter">
            <option value="all">All</option>
            <option value="image">Images</option>
            <option value="video">Videos</option>
            <option value="audio">Audio</option>
            <option value="text">Text</option>
        </select>
    </section>

    <section id="post-container">
        <!-- Filtered posts are rendered here -->
    </section>

</main>

<button id="top-button" aria-label="Back to top" hidden>
    ↑
</button>

<!-- Data -->
<script src="data/posts.js"></script>
<script src="data/descriptions.js"></script>

<!-- Shared modules -->
<script src="js/postRepository.js"></script>
<script src="js/markdown.js"></script>

<!-- Components -->
<script src="js/components/header.js"></script>
<script src="js/components/post.js"></script>
<script src="js/components/topButton.js"></script>

<!-- Page -->
<script src="js/pages/tag.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            await repository.initialize();

            Header.render(
                document.getElementById("site-header")
            );

            TopButton.initialize(
                document.getElementById("top-button")
            );

            await TagPage.initialize({
                container: document.getElementById("post-container"),
                title: document.getElementById("tag-title"),
                description: document.getElementById("tag-description"),
                filter: document.getElementById("category-filter")
            });
        } catch (error) {
            console.error(error);

            document.getElementById("post-container").innerHTML = `
                <p class="empty-message">
                    Unable to load the tag.
                </p>
            `;
        }
    });
</script>

</body>
</html>
